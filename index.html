<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포켓몬 슬립 요리 계산기</title>
    <style>
        @font-face {
          font-family: 'LINE Seed KR';
          src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_11-01@1.0/LINESeedKR-Rg.woff2') format('woff2');
          font-weight: 400;
          font-style: normal;
        }
        @font-face {
          font-family: 'LINE Seed KR';
          src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_11-01@1.0/LINESeedKR-Bd.woff2') format('woff2');
          font-weight: 700;
          font-style: normal;
        }

        :root{
          --ui:"LINE Seed KR",sans-serif;
        }

        body { 
            font-family: var(--ui); 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 20px; 
            background-color: #f4f7f6; 
        }

        h1 { text-align: center; color: #2c3e50; font-size: 26px; margin-bottom: 30px; }
        
        .layout-container {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        .left-panel { flex: 1; min-width: 300px; }
        .right-panel { flex: 1.2; min-width: 300px; }

        @media (max-width: 768px) {
            .layout-container { flex-direction: column; }
        }

        .section { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .section-title { font-size: 18px; margin-top: 0; margin-bottom: 15px; color: #34495e; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px;}
        
        .type-select, .pot-input { width: 100%; padding: 10px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        
        .ingredient-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; }
        .ingredient-item { display: flex; flex-direction: column; align-items: center; text-align: center; cursor: pointer; transition: 0.2s; padding: 5px; border-radius: 8px; }
        .ingredient-item:hover { background: #f0f0f0; }
        .ingredient-item label { font-size: 12px; margin-bottom: 5px; color: #555; word-break: keep-all; cursor: pointer; }
        .ingredient-item input { width: 50px; padding: 5px; text-align: center; border: 1px solid #ccc; border-radius: 5px; cursor: text; }
        
        .ingredient-item.locked img, .ingredient-item.locked .icon-placeholder { filter: grayscale(100%) opacity(40%); }
        .ingredient-item.locked label { text-decoration: line-through; color: #aaa; }
        .ingredient-item.locked input { background-color: #eee; color: #aaa; pointer-events: none; }
        .icon-placeholder { width: 40px; height: 40px; background-color: #e0e0e0; border-radius: 50%; margin-bottom: 5px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #888;}

        .recipe-toggle-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
        .recipe-toggle { padding: 8px; border: 1px solid #ccc; border-radius: 6px; cursor: pointer; font-size: 13px; text-align: center; transition: 0.2s; }
        .recipe-toggle.discovered { background: #fdfae6; border-color: #f1c40f; color: #d35400; font-weight: bold; } 
        .recipe-toggle.undiscovered { background: #eee; border-color: #ccc; color: #7f8c8d; } 
        
        .recipe { padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 5px solid #ccc; background: #f9f9f9; position: relative;}
        .can-make { border-left-color: #27ae60; background: #e8f8f5; }
        .sunday-target { border-left-color: #9b59b6; background: #f4e8f9; }
        .locked-recipe { border-left-color: #7f8c8d; background: #f2f2f2; opacity: 0.8; }
        
        .recipe-title { font-weight: bold; font-size: 16px; margin-bottom: 5px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 5px;}
        .capacity-badge { font-size: 12px; background: #ddd; padding: 3px 8px; border-radius: 10px; font-weight: normal; }
        .new-badge { font-size: 11px; background: #e74c3c; color: white; padding: 3px 6px; border-radius: 5px; margin-right: 5px; animation: pulse 1.5s infinite; }
        
        .ingredient-details { font-size: 13px; margin-top: 5px; line-height: 1.5; }
        .locked-info { color: #7f8c8d; font-size: 13px; margin-top: 5px; font-weight: bold; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div style="text-align: center; margin-bottom: 10px;">

            { name: "특선사과 주스", type: "드링크/디저트", ingredients: { "특선사과": 8 } },

            { name: "불꽃 생강차", type: "드링크/디저트", ingredients: { "따뜻한생강": 9, "특선사과": 7 } },
            { name: "푸린의 푸딩 아라모드", type: "드링크/디저트", ingredients: { "달콤한꿀": 20, "특선에그": 15, "튼튼밀크": 10, "특선사과": 10 } },
            { name: "악마의키스 후르츠오레", type: "드링크/디저트", ingredients: { "특선사과": 11, "튼튼밀크": 9, "달콤한꿀": 7, "릴랙스카카오": 8 } },
            { name: "희망사항 애플파이", type: "드링크/디저트", ingredients: { "특선사과": 12, "튼튼밀크": 4 } },
            { name: "네롤리 디톡스 티", type: "드링크/디저트", ingredients: { "따뜻한생강": 11, "특선사과": 15, "풍미버섯": 9 } },
            { name: "달콤한향기 초코케이크", type: "드링크/디저트", ingredients: { "달콤한꿀": 9, "릴랙스카카오": 8, "튼튼밀크": 7 } },
            { name: "튼튼 핫밀크", type: "드링크/디저트", ingredients: { "튼튼밀크": 7 } },
            { name: "곡예 소이 케이크", type: "드링크/디저트", ingredients: { "특선에그": 8, "연둣빛대두": 7 } },
            { name: "의욕 프로틴 스무디", type: "드링크/디저트", ingredients: { "연둣빛대두": 15, "릴랙스카카오": 8 } },
            { name: "마이페이스 야채 주스", type: "드링크/디저트", ingredients: { "숙면토마토": 9, "특선사과": 7 } },
            { name: "큰 말라사다", type: "드링크/디저트", ingredients: { "퓨어오일": 10, "튼튼밀크": 7, "달콤한꿀": 6 } },
            { name: "천하장사 소이 도넛", type: "드링크/디저트", ingredients: { "퓨어오일": 12, "연둣빛대두": 16, "릴랙스카카오": 7 } },
            { name: "대폭발 팝콘", type: "드링크/디저트", ingredients: { "연둣빛옥수수": 15, "퓨어오일": 14, "튼튼밀크": 7 } },
            { name: "다과회 옥수수 스콘", type: "드링크/디저트", ingredients: { "특선사과": 20, "따뜻한생강": 20, "연둣빛옥수수": 18, "튼튼밀크": 9 } },
            { name: "꽃잎댄스 초코 타르트", type: "드링크/디저트", ingredients: { "특선사과": 11, "릴랙스카카오": 11 } },
            { name: "플라워기프트 마카롱", type: "드링크/디저트", ingredients: { "릴랙스카카오": 25, "특선에그": 25, "달콤한꿀": 17, "튼튼밀크": 10 } },
            { name: "일찍기상 커피 젤리", type: "드링크/디저트", ingredients: { "각성원두": 16, "튼튼밀크": 14, "달콤한꿀": 12 } },
            { name: "스파크 스파이스 콜라", type: "드링크/디저트", ingredients: { "특선사과": 35, "따뜻한생강": 20, "굵은대파": 20, "각성원두": 12 } },
            { name: "틀깨기 콘 티라미수", type: "드링크/디저트", ingredients: { "각성원두": 14, "연둣빛옥수수": 14, "튼튼밀크": 12 } },
            { name: "토오 에클레어", type: "드링크/디저트", ingredients: { "릴랙스카카오": 30, "튼튼밀크": 26, "각성원두": 24, "달콤한꿀": 22 } },
            { name: "두근두근 겁나는얼굴 팬케이크", type: "드링크/디저트", ingredients: { "묵직한호박": 18, "특선에그": 24, "달콤한꿀": 32, "숙면토마토": 29 } },
            { name: "그래스믹서 스무디", type: "드링크/디저트", ingredients: { "반들반들아보카도": 18, "숙면토마토": 16, "튼튼밀크": 14 } },
            { name: "꿀모으기 초코 와플", type: "드링크/디저트", ingredients: { "달콤한꿀": 38, "연둣빛옥수수": 28, "퓨어오일": 28, "릴랙스카카오": 21 } }
        ];

        window.onload = function() {
            loadData();

            const container = document.getElementById('ingredients-container');
            ALL_INGREDIENTS.forEach(ing => {
                let imgTag = IMG_LINKS[ing] 
                    ? `<img src="${IMG_LINKS[ing]}" alt="${ing}" style="width: 40px; height: 40px; object-fit: contain; margin-bottom: 5px;" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">`
                    : '';
                
                let placeholderStyle = IMG_LINKS[ing] ? 'display:none;' : 'display:flex;';

                let isLockedClass = lockedIngredients[ing] ? 'locked' : '';

                container.innerHTML += `
                    <div class="ingredient-item ${isLockedClass}" id="item-${ing}" onclick="toggleIngredientLock('${ing}', event)">
                        ${imgTag}
                        <div class="icon-placeholder" style="${placeholderStyle} width:40px; height:40px; border-radius:50%; background:#e0e0e0; margin:0 auto 5px; align-items:center; justify-content:center; font-size:9px;">이미지<br>없음</div>
                        <label>${ing}</label>
                        <input type="number" id="ing-${ing}" value="0" min="0" onclick="event.stopPropagation();" oninput="saveData(); calculateRecipes();">
                    </div>
                `;
            });

            ALL_INGREDIENTS.forEach(ing => {
                if(savedInventory[ing] !== undefined) {
                    document.getElementById(`ing-${ing}`).value = savedInventory[ing];
                }
            });

            handleTypeChange();
        };

        function saveData() {
            let inventory = {};
            ALL_INGREDIENTS.forEach(ing => {
                inventory[ing] = document.getElementById(`ing-${ing}`).value;
            });

            const data = {
                potSize: document.getElementById('pot-size').value,
                recipeType: document.getElementById('recipe-type').value,
                inventory: inventory,
                lockedIngredients: lockedIngredients,
                recipeDiscovered: recipeDiscovered
            };

            localStorage.setItem('pokemonSleepCalculatorData', JSON.stringify(data));
        }

        let savedInventory = {};

        function loadData() {
            const saved = localStorage.getItem('pokemonSleepCalculatorData');
            if (saved) {
                const data = JSON.parse(saved);
                if (data.potSize) document.getElementById('pot-size').value = data.potSize;
                if (data.recipeType) document.getElementById('recipe-type').value = data.recipeType;
                if (data.inventory) savedInventory = data.inventory;
                if (data.lockedIngredients) lockedIngredients = data.lockedIngredients;
                if (data.recipeDiscovered) recipeDiscovered = data.recipeDiscovered;
            }
            
            RECIPES.forEach(r => {
                if (recipeDiscovered[r.name] === undefined) {
                    recipeDiscovered[r.name] = true;
                }
            });
        }

        function handleTypeChange() {
            saveData(); 
            const selectedType = document.getElementById('recipe-type').value;
            const toggleContainer = document.getElementById('recipe-toggle-container');
            
            toggleContainer.innerHTML = ''; 

            RECIPES.filter(r => r.type === selectedType).forEach(recipe => {
                const isDiscovered = recipeDiscovered[recipe.name];
                const btnClass = isDiscovered ? 'discovered' : 'undiscovered';
                const icon = isDiscovered ? '✅' : '🔒';
                
                toggleContainer.innerHTML += `
                    <div class="recipe-toggle ${btnClass}" onclick="toggleRecipeLock('${recipe.name}')" id="toggle-${recipe.name}">
                        ${icon} ${recipe.name}
                    </div>
                `;
            });

            calculateRecipes(); 
        }

        function toggleRecipeLock(recipeName) {
            recipeDiscovered[recipeName] = !recipeDiscovered[recipeName]; 
            saveData(); 
            handleTypeChange(); 
        }

        function toggleIngredientLock(ing, event) {
            lockedIngredients[ing] = !lockedIngredients[ing];
            
            const itemElement = document.getElementById(`item-${ing}`);
            const inputElement = document.getElementById(`ing-${ing}`);
            
            if (lockedIngredients[ing]) {
                itemElement.classList.add('locked');
                inputElement.value = "0"; 
            } else {
                itemElement.classList.remove('locked');
            }
            saveData(); 
            calculateRecipes(); 
        }

        function calculateRecipes() {
            const selectedType = document.getElementById('recipe-type').value;
            const currentPotSize = parseInt(document.getElementById('pot-size').value) || 0;

            let myInventory = {};
            ALL_INGREDIENTS.forEach(ing => {
                myInventory[ing] = parseInt(document.getElementById(`ing-${ing}`).value) || 0;
            });

            let resultsHTML = '';
            let canMakeList = [];
            let cannotMakeList = [];
            let sundayTargetList = []; 
            let impossibleList = []; 

            RECIPES.filter(r => r.type === selectedType).forEach(recipe => {
                let ingredientInfo = []; 
                let totalMissing = 0;
                let requiredCapacity = 0;
                let hasLockedIngredient = false;
                let lockedNames = [];

                for (let [reqIng, reqAmount] of Object.entries(recipe.ingredients)) {
                    requiredCapacity += reqAmount;
                    let myAmount = myInventory[reqIng] || 0;
                    
                    if (lockedIngredients[reqIng]) {
                        hasLockedIngredient = true;
                        lockedNames.push(reqIng);
                    }

                    if (myAmount >= reqAmount) {
                        ingredientInfo.push(`<span style="color: #27ae60;">✅ ${reqIng} (보유: ${myAmount} / 필요: ${reqAmount})</span>`);
                    } else {
                        let lack = reqAmount - myAmount;
                        ingredientInfo.push(`<span style="color: #e74c3c;">❌ ${reqIng} ${lack}개 부족 (보유: ${myAmount} / 필요: ${reqAmount})</span>`);
                        totalMissing += lack;
                    }
                }

                const isNewTarget = !recipeDiscovered[recipe.name];
                const recipeData = { ...recipe, ingredientInfo, totalMissing, requiredCapacity, lockedNames, isNewTarget };

                if (hasLockedIngredient) {
                    impossibleList.push(recipeData);
                } 
                else if (requiredCapacity <= currentPotSize) {
                    if (totalMissing === 0) {
                        canMakeList.push(recipeData);
                    } else {
                        cannotMakeList.push(recipeData);
                    }
                } 
                else {
                    sundayTargetList.push(recipeData);
                }
            });

            cannotMakeList.sort((a, b) => {
                if (a.isNewTarget !== b.isNewTarget) {
                    return (b.isNewTarget ? 1 : 0) - (a.isNewTarget ? 1 : 0);
                }
                return a.totalMissing - b.totalMissing;
            });

            sundayTargetList.sort((a, b) => {
                if (a.isNewTarget !== b.isNewTarget) {
                    return (b.isNewTarget ? 1 : 0) - (a.isNewTarget ? 1 : 0);
                }
                return a.totalMissing - b.totalMissing;
            });

            if (canMakeList.length > 0) {
                resultsHTML += `<h4 style="color:#27ae60; border-bottom: 2px solid #27ae60; padding-bottom: 5px;">✨ 지금 바로 만들 수 있어요!</h4>`;
                canMakeList.forEach(r => {
                    let newBadge = r.isNewTarget ? `<span class="new-badge">🆕 도감 목표!</span>` : '';
                    resultsHTML += `
                        <div class="recipe can-make">
                            <div class="recipe-title">
                                <span>${newBadge}${r.name}</span>
                                <span class="capacity-badge">용량: ${r.requiredCapacity}</span>
                            </div>
                            <div class="ingredient-details">${r.ingredientInfo.join("<br>")}</div>
                        </div>
                    `;
                });
            } else {
                resultsHTML += `<h4 style="color:#7f8c8d;">✨ 지금 바로 만들 수 있는 요리가 없습니다.</h4>`;
            }

            if (cannotMakeList.length > 0) {
                resultsHTML += `<h4 style="margin-top:30px; border-bottom: 2px solid #ccc; padding-bottom: 5px;">🤔 재료를 더 모아보세요 (평일 가능)</h4>`;
                cannotMakeList.forEach(r => {
                    let newBadge = r.isNewTarget ? `<span class="new-badge">🆕 도감 목표!</span>` : '';
                    resultsHTML += `
                        <div class="recipe">
                            <div class="recipe-title">
                                <span>${newBadge}${r.name}</span>
                                <span class="capacity-badge">용량: ${r.requiredCapacity}</span>
                            </div>
                            <div class="ingredient-details">${r.ingredientInfo.join("<br>")}</div>
                        </div>
                    `;
                });
            }

            if (sundayTargetList.length > 0) {
                resultsHTML += `<h4 style="margin-top:30px; color:#8e44ad; border-bottom: 2px solid #8e44ad; padding-bottom: 5px;">🌟 일요일 대형 냄비 추천 목표!</h4>`;
                sundayTargetList.forEach(r => {
                    let newBadge = r.isNewTarget ? `<span class="new-badge">🆕 도감 목표!</span>` : '';
                    resultsHTML += `
                        <div class="recipe sunday-target">
                            <div class="recipe-title">
                                <span>${newBadge}${r.name}</span>
                                <span class="capacity-badge">필요 용량: ${r.requiredCapacity}</span>
                            </div>
                            <div class="ingredient-details" style="margin-top:8px;">${r.ingredientInfo.join("<br>")}</div>
                        </div>
                    `;
                });
            }

            if (impossibleList.length > 0) {
                resultsHTML += `<h4 style="margin-top:30px; color:#7f8c8d; border-bottom: 2px solid #ccc; padding-bottom: 5px;">🚨 미해금 재료가 포함된 요리 (제작 불가)</h4>`;
                impossibleList.forEach(r => {
                    let newBadge = r.isNewTarget ? `<span class="new-badge">🆕 도감 목표!</span>` : '';
                    resultsHTML += `
                        <div class="recipe locked-recipe">
                            <div class="recipe-title" style="color: #555;">
                                <span>${newBadge}${r.name}</span>
                                <span class="capacity-badge">용량: ${r.requiredCapacity}</span>
                            </div>
                            <div class="locked-info">🔒 미해금 재료: ${r.lockedNames.join(", ")}</div>
                        </div>
                    `;
                });
            }

            document.getElementById('results').innerHTML = resultsHTML;
        }
    </script>
</body>
</html>
